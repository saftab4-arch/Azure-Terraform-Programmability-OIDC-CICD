name: Terraform CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform-ci:
    name: Terraform CI
    runs-on: ubuntu-latest

    steps:
      # Get the PR/feature branch code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # Check Terraform formatting
      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Login to Azure using GitHub OIDC
      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Connect Terraform to our Azure Blob remote state
      - name: Terraform Init
        run: terraform init -input=false

      # Validate Terraform
      - name: Terraform Validate
        run: terraform validate -no-color

      # Terraform linting / quality checks
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Run TFLint
        run: |
          tflint --init
          tflint

      # Security / misconfiguration scanning
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform

      # Show what Terraform WOULD change — no deployment
      - name: Terraform Plan
        run: terraform plan -input=false -no-color
